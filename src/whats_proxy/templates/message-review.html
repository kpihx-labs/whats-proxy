<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whats-Proxy — Message Review</title>
<link rel="stylesheet" href="/assets/hitl.css">
</head><body>

<script type="application/json" id="payload-data">{{PAYLOAD_JSON}}</script>

<header class="hitl-header">
  <div>
    <h1 class="hitl-brand">🟢 Whats-Proxy · Message Review</h1>
    <p class="hitl-subtitle">{{FUNC_NAME}} — edit freely, approve to send</p>
  </div>
  <div class="hitl-actions">
    <button class="hitl-button hitl-reject" onclick="submit('rejected')">✕ Reject</button>
    <button class="hitl-button hitl-approve" onclick="submit('approved')">✓ Approve &amp; send</button>
  </div>
</header>

<main class="hitl-container">
  <section class="hitl-card">
    <h2>✏️ Editor</h2>
    <div class="hitl-card-body">
      <div class="editor-row">
        <label class="editor-label">To (JID)</label>
        <input class="editor-input" id="ed-jid" type="text">
      </div>
      <div class="editor-row">
        <label class="editor-label">Message</label>
        <div class="editor-toolbar">
          <button class="tb-btn" onclick="wrap('*','*')" title="Bold">B</button>
          <button class="tb-btn" onclick="wrap('_','_')" title="Italic"><i>I</i></button>
          <button class="tb-btn" onclick="wrap('~','~')" title="Strikethrough"><s>S</s></button>
          <button class="tb-btn" onclick="ins('\n• ')" title="Bullet">•</button>
          <button class="tb-btn" onclick="ins('\n# ')" title="Title">#</button>
        </div>
        <textarea class="editor-textarea" id="ed-text" rows="8"></textarea>
      </div>
      <div class="editor-row" id="ed-extra"></div>
    </div>
  </section>

  <section class="hitl-card">
    <h2>🔧 Raw JSON</h2>
    <div class="hitl-card-body">
      <textarea class="hitl-input" id="payload" rows="14"></textarea>
    </div>
  </section>
</main>

<footer class="hitl-footer">
  <textarea class="hitl-input" id="comment" placeholder="Comment (optional)" rows="2"></textarea>
</footer>

<script>
var ORIGINAL, payload;
try {
    payload = JSON.parse(document.getElementById('payload-data').textContent);
    ORIGINAL = JSON.parse(JSON.stringify(payload));
} catch(e) {
    payload = {};
    ORIGINAL = {};
}
document.getElementById('ed-jid').value = payload.jid || payload.to || payload.to_jid || '';
document.getElementById('ed-text').value = payload.text || payload.caption || payload.question || payload.name || payload.new_text || '';
document.getElementById('payload').value = JSON.stringify(payload, null, 2);

// Extra fields
var extra = document.getElementById('ed-extra');
if (payload.options) addField(extra,'options','Poll options (one per line)',(payload.options||[]).join('\n'),'textarea');
if (payload.latitude!=null) addField(extra,'latitude','Latitude',payload.latitude,'number');
if (payload.longitude!=null) addField(extra,'longitude','Longitude',payload.longitude,'number');
if (payload.contacts) addField(extra,'contacts','Contacts',JSON.stringify(payload.contacts,null,2),'textarea');
if (payload.source) addField(extra,'source','Source',payload.source,'text');
if (payload.new_text) addField(extra,'new_text','New text',payload.new_text,'textarea');
if (payload.to_jid) addField(extra,'to_jid','Forward to',payload.to_jid,'text');
extra.querySelectorAll('input,textarea').forEach(function(el){el.addEventListener('input',sync)});

function wrap(b,a){var t=document.getElementById('ed-text'),s=t.selectionStart,e=t.selectionEnd,sel=t.value.substring(s,e);t.value=t.value.substring(0,s)+b+(sel||'text')+a+t.value.substring(e);t.focus();t.setSelectionRange(s+b.length,s+b.length+(sel?sel.length:4));sync()}
function ins(txt){var t=document.getElementById('ed-text'),p=t.selectionStart;t.value=t.value.substring(0,p)+txt+t.value.substring(p);t.focus();t.setSelectionRange(p+txt.length,p+txt.length);sync()}
function addField(c,k,l,v,t){var r=document.createElement('div');r.className='editor-row';var lb=document.createElement('label');lb.className='editor-label';lb.textContent=l;r.appendChild(lb);if(t==='textarea'){var ta=document.createElement('textarea');ta.className='editor-textarea';ta.id='ed-'+k;ta.value=v;ta.rows=3;r.appendChild(ta)}else{var i=document.createElement('input');i.className='editor-input';i.id='ed-'+k;i.type=t;i.value=v;r.appendChild(i)}c.appendChild(r);el=function(e){el.addEventListener('input',sync)}}

function sync(){var u=JSON.parse(JSON.stringify(payload));u.jid=document.getElementById('ed-jid').value||u.jid;u.to=u.jid;var t=document.getElementById('ed-text').value;if('text' in u)u.text=t;else if('caption' in u)u.caption=t;else if('question' in u)u.question=t;else if('name' in u)u.name=t;else if('new_text' in u)u.new_text=t;var o=document.getElementById('ed-options');if(o&&'options'in u)u.options=o.value.split('\n').filter(Boolean);var n=document.getElementById('ed-new_text');if(n)u.new_text=n.value;document.getElementById('payload').value=JSON.stringify(u,null,2)}

async function submit(status){
    sync();
    var raw=document.getElementById('payload').value;
    var p;try{p=JSON.parse(raw)}catch(e){p=raw}
    var c=document.getElementById('comment').value;
    var edited=JSON.stringify(p)!==JSON.stringify(ORIGINAL);
    var r=await fetch('/submit',{method:'POST',body:JSON.stringify({id:'{{REQUEST_ID}}',status:status,comment:c,payload:p,edited:edited})});
    if(r.ok)document.body.innerHTML='<div class="hitl-done"><h2>'+(status==='approved'?'✅ SENT':'❌ REJECTED')+'</h2><p style="opacity:.6">Close this window.</p></div>';
}

document.querySelectorAll('[id^="ed-"]').forEach(function(el){el.addEventListener('input',sync)});
document.getElementById('payload').addEventListener('input',sync);
</script>
</body></html>
