<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whats-Proxy — Message Review</title>
<link rel="stylesheet" href="/assets/hitl.css">
</head><body>

<header class="hitl-header">
  <div>
    <h1 class="hitl-brand">🟢 Whats-Proxy · Message Review</h1>
    <p class="hitl-subtitle">Action: {{FUNC_NAME}} — edit freely, approve to send</p>
  </div>
  <div class="hitl-actions">
    <button class="hitl-button hitl-reject" onclick="submit('rejected')">✕ Reject</button>
    <button class="hitl-button hitl-approve" onclick="submit('approved')">✓ Approve &amp; send</button>
  </div>
</header>

<main class="hitl-container">

  <!-- ===== Visual Editor (editable preview) ===== -->
  <section class="hitl-card">
    <h2>✏️ Message Editor — edit directly below, changes sync to JSON</h2>
    <div class="hitl-card-body">
      <div class="editor-row">
        <label class="editor-label">To (JID)</label>
        <input class="editor-input" id="ed-jid" type="text" placeholder="33612345678 or group@g.us">
      </div>
      <div class="editor-row">
        <label class="editor-label">Message</label>
        <div class="editor-toolbar" id="toolbar">
          <button class="tb-btn" onclick="wrapText('*','*')" title="Bold">B</button>
          <button class="tb-btn" onclick="wrapText('_','_')" title="Italic"><i>I</i></button>
          <button class="tb-btn" onclick="wrapText('~','~')" title="Strikethrough"><s>S</s></button>
          <button class="tb-btn" onclick="wrapText('```','```')" title="Code">{'<>'}</button>
          <button class="tb-btn" onclick="insertText('\n')" title="Line break">↵</button>
          <button class="tb-btn" onclick="insertText('\n• ')" title="Bullet">•</button>
          <button class="tb-btn" onclick="insertText('\n# ')" title="Title">#</button>
          <button class="tb-btn" onclick="insertText('\n---\n')" title="Separator">—</button>
        </div>
        <textarea class="editor-textarea" id="ed-text" placeholder="Type your message here..." rows="6"></textarea>
      </div>
      <div class="editor-row" id="ed-extra-fields"></div>
    </div>
  </section>

  <!-- ===== Live Preview (read-only WhatsApp bubble) ===== -->
  <section class="hitl-card">
    <h2>👁️ Live Preview</h2>
    <div class="hitl-card-body">
      <div class="preview-bubble" id="preview-bubble">
        <div class="preview-sender" id="preview-sender"></div>
        <div class="preview-content" id="preview-content">Start typing above...</div>
        <div class="preview-timestamp" id="preview-timestamp"></div>
      </div>
    </div>
  </section>

  <!-- ===== Raw JSON Editor (always available) ===== -->
  <section class="hitl-card">
    <h2>🔧 Raw JSON — edit directly or sync from visual editor</h2>
    <div class="hitl-card-body">
      <textarea class="hitl-input" id="payload" rows="12">{{PAYLOAD_JSON}}</textarea>
    </div>
  </section>

</main>

<footer class="hitl-footer">
  <textarea class="hitl-input" id="comment" placeholder="Comment (optional) — e.g. 'Changed tone to formal'" rows="2"></textarea>
</footer>

<script>
const ORIGINAL = JSON.parse('{{PAYLOAD_JSON_SAFE}}');
const payload = JSON.parse('{{PAYLOAD_JSON_SAFE}}');

// ── Initialize visual editor from payload ───────────────────────────────────
document.getElementById('ed-jid').value = payload.jid || payload.to || '';
document.getElementById('ed-text').value = payload.text || payload.caption || payload.question || payload.name || payload.message || '';

// Render extra fields (poll options, location, contact, etc.)
const extra = document.getElementById('ed-extra-fields');
const fields = [];
if (payload.options) fields.push({ label: 'Poll options (one per line)', key: 'options', value: (payload.options || []).join('\n'), type: 'textarea' });
if (payload.latitude != null) fields.push({ label: 'Latitude', key: 'latitude', value: payload.latitude, type: 'number' });
if (payload.longitude != null) fields.push({ label: 'Longitude', key: 'longitude', value: payload.longitude, type: 'number' });
if (payload.contacts) fields.push({ label: 'Contacts', key: 'contacts', value: JSON.stringify(payload.contacts, null, 2), type: 'textarea' });
if (payload.source) fields.push({ label: 'Source / Path', key: 'source', value: payload.source, type: 'text', readonly: true });
if (payload.message_id) fields.push({ label: 'Message ID', key: 'message_id', value: payload.message_id, type: 'text', readonly: true });
if (payload.to_jid) fields.push({ label: 'Forward to', key: 'to_jid', value: payload.to_jid, type: 'text' });
if (payload.new_text) fields.push({ label: 'New text (edit)', key: 'new_text', value: payload.new_text, type: 'textarea' });

fields.forEach(f => {
    const row = document.createElement('div');
    row.className = 'editor-row';
    const label = document.createElement('label');
    label.className = 'editor-label';
    label.textContent = f.label;
    row.appendChild(label);
    if (f.type === 'textarea') {
        const ta = document.createElement('textarea');
        ta.className = 'editor-textarea';
        ta.id = 'ed-' + f.key;
        ta.value = f.value;
        ta.rows = 4;
        row.appendChild(ta);
    } else {
        const inp = document.createElement('input');
        inp.className = 'editor-input';
        inp.id = 'ed-' + f.key;
        inp.type = f.type;
        inp.value = f.value;
        if (f.readonly) inp.readOnly = true;
        row.appendChild(inp);
    }
    extra.appendChild(row);
});

// ── Live preview rendering ──────────────────────────────────────────────────
function renderPreview() {
    const text = document.getElementById('ed-text').value;
    const jid = document.getElementById('ed-jid').value;
    const bubble = document.getElementById('preview-content');
    const sender = document.getElementById('preview-sender');
    const ts = document.getElementById('preview-timestamp');

    // WhatsApp-style formatting
    let html = escapeHtml(text || '[empty message]');
    html = html.replace(/\*(.+?)\*/g, '<strong>$1</strong>');
    html = html.replace(/_(.+?)_/g, '<em>$1</em>');
    html = html.replace(/~(.+?)~/g, '<del>$1</del>');
    html = html.replace(/```(.+?)```/g, '<code>$1</code>');
    html = html.replace(/\n/g, '<br>');

    bubble.innerHTML = html || '<span style="opacity:0.5">[empty]</span>';
    sender.textContent = jid || '(no recipient)';
    ts.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// ── Toolbar helpers ─────────────────────────────────────────────────────────
function wrapText(before, after) {
    const ta = document.getElementById('ed-text');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const sel = ta.value.substring(start, end);
    ta.value = ta.value.substring(0, start) + before + sel + after + ta.value.substring(end);
    ta.focus();
    ta.setSelectionRange(start + before.length, end + before.length);
    syncFromVisual();
}

function insertText(text) {
    const ta = document.getElementById('ed-text');
    const pos = ta.selectionStart;
    ta.value = ta.value.substring(0, pos) + text + ta.value.substring(pos);
    ta.focus();
    ta.setSelectionRange(pos + text.length, pos + text.length);
    syncFromVisual();
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Sync visual → JSON ─────────────────────────────────────────────────────
function syncFromVisual() {
    const updated = { ...payload };
    updated.jid = document.getElementById('ed-jid').value || updated.jid;
    updated.to = updated.jid;
    const text = document.getElementById('ed-text').value;
    if ('text' in updated) updated.text = text;
    else if ('caption' in updated) updated.caption = text;
    else if ('question' in updated) updated.question = text;
    else if ('name' in updated) updated.name = text;
    else if ('message' in updated) updated.message = text;

    // Extra fields
    const optsEl = document.getElementById('ed-options');
    if (optsEl && 'options' in updated) updated.options = optsEl.value.split('\n').filter(Boolean);
    const latEl = document.getElementById('ed-latitude');
    if (latEl) updated.latitude = parseFloat(latEl.value) || 0;
    const lngEl = document.getElementById('ed-longitude');
    if (lngEl) updated.longitude = parseFloat(lngEl.value) || 0;
    const contactsEl = document.getElementById('ed-contacts');
    if (contactsEl) { try { updated.contacts = JSON.parse(contactsEl.value); } catch {} }
    const toJidEl = document.getElementById('ed-to_jid');
    if (toJidEl) updated.to_jid = toJidEl.value;
    const newTextEl = document.getElementById('ed-new_text');
    if (newTextEl) updated.new_text = newTextEl.value;

    document.getElementById('payload').value = JSON.stringify(updated, null, 2);
    renderPreview();
}

// ── Sync JSON → visual (when user edits raw JSON) ──────────────────────────
function syncFromJson() {
    try {
        const parsed = JSON.parse(document.getElementById('payload').value);
        document.getElementById('ed-jid').value = parsed.jid || parsed.to || '';
        document.getElementById('ed-text').value = parsed.text || parsed.caption || parsed.question || parsed.name || '';
        const optsEl = document.getElementById('ed-options');
        if (optsEl && parsed.options) optsEl.value = (parsed.options || []).join('\n');
        const latEl = document.getElementById('ed-latitude');
        if (latEl && parsed.latitude != null) latEl.value = parsed.latitude;
        const lngEl = document.getElementById('ed-longitude');
        if (lngEl && parsed.longitude != null) lngEl.value = parsed.longitude;
        const toJidEl = document.getElementById('ed-to_jid');
        if (toJidEl && parsed.to_jid) toJidEl.value = parsed.to_jid;
        const newTextEl = document.getElementById('ed-new_text');
        if (newTextEl && parsed.new_text) newTextEl.value = parsed.new_text;
        renderPreview();
    } catch {}
}

// ── Bi-directional sync ─────────────────────────────────────────────────────
document.getElementById('ed-jid').addEventListener('input', syncFromVisual);
document.getElementById('ed-text').addEventListener('input', syncFromVisual);
document.getElementById('payload').addEventListener('input', syncFromJson);
document.querySelectorAll('[id^="ed-"]').forEach(el => el.addEventListener('input', syncFromVisual));

// ── Submit ──────────────────────────────────────────────────────────────────
async function submit(status) {
    syncFromVisual();
    const raw = document.getElementById('payload').value;
    let payload;
    try { payload = JSON.parse(raw); } catch { payload = raw; }
    const comment = document.getElementById('comment').value;
    const edited = (JSON.stringify(payload) !== JSON.stringify(ORIGINAL));
    const resp = await fetch('/submit', {
        method: 'POST',
        body: JSON.stringify({ id: '{{REQUEST_ID}}', status, comment, payload, edited })
    });
    if (resp.ok) {
        document.body.innerHTML = '<div class="hitl-done"><h2>✅ ' + status.toUpperCase() + '</h2><p>' + (status === 'approved' ? 'Message sent!' : 'Message rejected.') + '</p><p style="opacity:0.5">You can close this window.</p></div>';
    }
}

// ── Init ────────────────────────────────────────────────────────────────────
renderPreview();
document.getElementById('comment').value = payload.comment || '';
</script>
</body></html>
