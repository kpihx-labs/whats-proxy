<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whats-Proxy — Message Review</title>
<link rel="stylesheet" href="/assets/hitl.css">
</head><body>

<script type="application/json" id="payload-data">{{PAYLOAD_JSON}}</script>
<script type="application/json" id="ref-msg-data">{{REFERENCED_MSG}}</script>
<script type="application/json" id="resolved-names">{{RESOLVED_NAMES}}</script>

<header class="hitl-header">
  <div>
    <h1 class="hitl-brand">🟢 Whats-Proxy · Message Review</h1>
    <p class="hitl-subtitle">{{FUNC_NAME}} — edit freely, approve to send</p>
    <p class="hitl-subtitle" style="opacity:0.6;font-size:0.85em">📱 Account: {{ACCOUNT_PHONE}}</p>
  </div>
  <div class="hitl-actions">
    <button class="hitl-button hitl-reject" onclick="submit('rejected')">✕ Reject</button>
    <button class="hitl-button hitl-approve" onclick="submit('approved')">✓ Approve &amp; send</button>
  </div>
</header>

<main class="hitl-container">
  <section class="hitl-card">
    <h2>✏️ Editor</h2>
    <div class="hitl-card-body">
      <div class="editor-row" id="ed-jid-row">
        <label class="editor-label" id="ed-jid-label">To (JID)</label>
        <input class="editor-input" id="ed-jid" type="text">
      </div>
      <div class="editor-row" id="ed-jids-row" style="display:none">
        <label class="editor-label" id="ed-jids-label">To (one JID per line)</label>
        <textarea class="editor-textarea" id="ed-jids" rows="4"></textarea>
      </div>
      <div class="editor-row" id="ed-text-row">
        <label class="editor-label" id="ed-text-label">Message</label>
        <div class="editor-toolbar" id="toolbar"></div>
        <textarea class="editor-textarea" id="ed-text" rows="8"></textarea>
      </div>
      <div class="editor-row" id="ed-extra"></div>
    </div>
  </section>

  <!-- ===== Referenced message (for delete/edit/reaction/forward) ===== -->
  <section class="hitl-card" id="ref-msg-section" style="display:none">
    <h2 id="ref-msg-title">📨 Message à modifier</h2>
    <div class="hitl-card-body">
      <div id="ref-media-preview"></div>
      <pre class="hitl-json" id="ref-msg-content" style="white-space:pre-wrap;word-break:break-word"></pre>
    </div>
  </section>

  <section class="hitl-card">
    <h2>🔧 Raw JSON</h2>
    <div class="hitl-card-body">
      <textarea class="hitl-input" id="payload" rows="14"></textarea>
    </div>
  </section>
</main>

<footer class="hitl-footer">
  <textarea class="hitl-input" id="comment" placeholder="Comment (optional)" rows="2"></textarea>
</footer>

<script>
var ORIGINAL, payload;
try {
    payload = JSON.parse(document.getElementById('payload-data').textContent);
    ORIGINAL = JSON.parse(JSON.stringify(payload));
} catch(e) {
    payload = {};
    ORIGINAL = {};
}
// Show resolved contact/group names next to JIDs
var resolvedNames = {};
try { resolvedNames = JSON.parse(document.getElementById('resolved-names').textContent || '{}'); } catch(e) {}

// Annotate JID fields with resolved names
function resolveJid(raw) {
  if (!raw) return '';
  var name = resolvedNames[raw];
  return name ? raw + ' (' + name + ')' : raw;
}

// ── Recipient field detection ──────────────────────────────────────────────
// Canonical recipient field per action. Multi-recipient actions (`to` array or
// `jids`) get a multi-line textarea; single-recipient get the plain input.
var recipientField = null;
var isMultiRecipient = false;
if ('jids' in payload) { recipientField = 'jids'; isMultiRecipient = true; }
else if ('to' in payload && Array.isArray(payload.to)) { recipientField = 'to'; isMultiRecipient = true; }
else if ('to' in payload) { recipientField = 'to'; }
else if ('to_jid' in payload) { recipientField = 'to_jid'; }
else if ('jid' in payload) { recipientField = 'jid'; }

if (isMultiRecipient) {
  document.getElementById('ed-jid-row').style.display = 'none';
  document.getElementById('ed-jids-row').style.display = '';
  document.getElementById('ed-jids').value = (Array.isArray(payload[recipientField]) ? payload[recipientField] : []).join('\n');
} else {
  document.getElementById('ed-jids-row').style.display = 'none';
  document.getElementById('ed-jid-row').style.display = '';
  var rawJid = recipientField ? (payload[recipientField] || '') : '';
  document.getElementById('ed-jid').value = rawJid;
  document.getElementById('ed-jid-label').textContent = 'To — ' + resolveJid(rawJid);
}

// ── Centralized message content extractor ────────────────────────────────
// Used by edit, delete, reaction, forward — single function for ALL message types.
function extractMessageContent(rawMsg) {
  var m = (rawMsg && rawMsg.message) ? rawMsg.message : (rawMsg || {});
  // Text messages
  if (m.conversation) return { text: m.conversation, type: 'text' };
  if (m.extendedTextMessage && m.extendedTextMessage.text) return { text: m.extendedTextMessage.text, type: 'text' };
  // Image
  if (m.imageMessage) return { text: m.imageMessage.caption || '[image]', type: 'image', url: m.imageMessage.url || m.imageMessage.mediaUrl || '', thumb: m.imageMessage.thumbnailDirectPath || '' };
  // Video
  if (m.videoMessage) return { text: m.videoMessage.caption || '[video]', type: 'video', url: m.videoMessage.url || m.videoMessage.mediaUrl || '' };
  // Audio
  if (m.audioMessage) return { text: m.audioMessage.ptt ? '[voice note]' : '[audio]', type: 'audio', ptt: !!m.audioMessage.ptt, url: m.audioMessage.url || m.audioMessage.mediaUrl || '' };
  // Document
  if (m.documentMessage) return { text: m.documentMessage.fileName || '[document]', type: 'document', url: m.documentMessage.url || m.documentMessage.mediaUrl || '' };
  // Sticker
  if (m.stickerMessage) return { text: '[sticker]', type: 'sticker', url: m.stickerMessage.url || m.stickerMessage.mediaUrl || '' };
  // Contact
  if (m.contactMessage) return { text: (m.contactMessage.displayName || '') + ' ' + (m.contactMessage.vcard || ''), type: 'contact' };
  if (m.contactsArrayMessage) return { text: '[' + ((m.contactsArrayMessage.contacts || []).length) + ' contacts]', type: 'contact' };
  // Location
  if (m.locationMessage) return { text: '📍 ' + (m.locationMessage.name || '') + ' ' + (m.locationMessage.address || ''), type: 'location', lat: m.locationMessage.degreesLatitude, lng: m.locationMessage.degreesLongitude };
  // Reaction
  if (m.reactionMessage) return { text: '❤️ ' + (m.reactionMessage.text || 'reaction'), type: 'reaction' };
  // System
  if (m.protocolMessage) return { text: '[system message]', type: 'system' };
  // Fallback: try extendedTextMessage contextInfo
  if (m.extendedTextMessage && m.extendedTextMessage.contextInfo && m.extendedTextMessage.contextInfo.stanzaId) {
    return { text: '[forwarded message]', type: 'forward' };
  }
  return { text: JSON.stringify(m, null, 2), type: 'unknown' };
}

// ── Show referenced message section ──────────────────────────────────────
var refSection = document.getElementById('ref-msg-section');
var refContent = document.getElementById('ref-msg-content');
var refTitle = document.getElementById('ref-msg-title');
var refMedia = document.getElementById('ref-media-preview');

var refActions = ['delete-message', 'edit-message', 'send-reaction', 'forward-message'];
var isRefAction = refActions.includes('{{FUNC_NAME}}');

if (isRefAction && refSection) {
  refSection.style.display = '';

  var refMsgStr = '';
  try { var refEl = document.getElementById('ref-msg-data'); if (refEl) refMsgStr = refEl.textContent || ''; } catch(e) {}

  if (refMsgStr && refMsgStr.length > 2) {
    try {
      var refParsed = JSON.parse(refMsgStr);
      var extracted = extractMessageContent(refParsed);

      // Update title with resolved name (number + name)
      var msgId = payload.message_id || payload.from_message_id || '';
      var rawJid = payload.jid || '';
      if (refTitle) refTitle.textContent = '📨 Message from ' + resolveJid(rawJid);

      // Show media preview
      if (refMedia) refMedia.innerHTML = '';
      if (extracted.url && extracted.type === 'image') {
        var img = document.createElement('img');
        img.src = extracted.url;
        img.style.cssText = 'max-width:100%;max-height:300px;border-radius:8px;margin:8px 0';
        img.onerror = function() { this.alt = '[image — preview not available]'; };
        if (refMedia) refMedia.appendChild(img);
      } else if (extracted.url && extracted.type === 'audio') {
        var audio = document.createElement('audio');
        audio.src = extracted.url;
        audio.controls = true;
        audio.style.cssText = 'width:100%;margin:8px 0';
        if (refMedia) refMedia.appendChild(audio);
      } else if (extracted.url && extracted.type === 'video') {
        var vid = document.createElement('video');
        vid.src = extracted.url;
        vid.controls = true;
        vid.style.cssText = 'max-width:100%;max-height:300px;border-radius:8px;margin:8px 0';
        if (refMedia) refMedia.appendChild(vid);
      } else if (extracted.url && extracted.type === 'sticker') {
        var stk = document.createElement('img');
        stk.src = extracted.url;
        stk.style.cssText = 'max-width:200px;max-height:200px;margin:8px 0';
        stk.onerror = function() { this.alt = '[sticker]'; };
        if (refMedia) refMedia.appendChild(stk);
      }

      // Show text content
      if (refContent) refContent.textContent = extracted.text;
    } catch(e) {
      if (refContent) refContent.textContent = refMsgStr;
    }
  } else {
    var msgId = payload.message_id || payload.from_message_id || '';
    var rawJid = payload.jid || '';
    if (refTitle) refTitle.textContent = '📨 Message #' + msgId + ' in ' + resolveJid(rawJid);
    if (refContent) refContent.textContent = '(Message not in local store)';
  }
}

// Hide Message field + toolbar for actions without text content
var hasText = 'text' in payload || 'caption' in payload || 'question' in payload || 'name' in payload || 'new_text' in payload;
var isMediaOnly = !hasText && ('source' in payload || 'latitude' in payload || 'message_id' in payload);
if (isMediaOnly) {
  document.getElementById('ed-text-row').style.display = 'none';
}
// Only show toolbar for text-like actions
if (hasText) {
  document.getElementById('toolbar').innerHTML =
    '<button class="tb-btn" onclick="wrap(\'*\',\'*\')" title="Bold">B</button>' +
    '<button class="tb-btn" onclick="wrap(\'_\',\'_\')" title="Italic"><i>I</i></button>' +
    '<button class="tb-btn" onclick="wrap(\'~\',\'~\')" title="Strikethrough"><s>S</s></button>' +
    '<button class="tb-btn" onclick="ins(\'\\n• \')" title="Bullet">•</button>' +
    '<button class="tb-btn" onclick="ins(\'\\n# \')" title="Title">#</button>';
} else {
  document.getElementById('toolbar').style.display = 'none';
}

document.getElementById('ed-text').value = payload.text || payload.caption || payload.question || payload.name || payload.new_text || '';
document.getElementById('payload').value = JSON.stringify(payload, null, 2);

// Extra fields
var extra = document.getElementById('ed-extra');
if (payload.options) addField(extra,'options','Poll options (one per line)',(payload.options||[]).join('\n'),'textarea');
if (payload.latitude!=null) addField(extra,'latitude','Latitude',payload.latitude,'number');
if (payload.longitude!=null) addField(extra,'longitude','Longitude',payload.longitude,'number');
if (payload.contacts) addField(extra,'contacts','Contacts',JSON.stringify(payload.contacts,null,2),'textarea');
if (payload.source) {
  addField(extra,'source','Source',payload.source,'text');
  // Image/video preview
  var src = String(payload.source);
  if (src.match(/\.(jpg|jpeg|png|gif|webp|svg)$/i) || src.startsWith('data:image')) {
    var img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'max-width:100%;max-height:300px;border-radius:8px;margin-top:8px;border:1px solid var(--border)';
    img.onerror=function(){this.style.display='none'};
    var previewRow = document.createElement('div');
    previewRow.className = 'editor-row';
    var previewLabel = document.createElement('label');
    previewLabel.className = 'editor-label';
    previewLabel.textContent = 'Image Preview';
    previewRow.appendChild(previewLabel);
    previewRow.appendChild(img);
    extra.appendChild(previewRow);
  }
  if (src.match(/\.(mp4|webm|ogg)$/i)) {
    var vid = document.createElement('video');
    vid.src = src;
    vid.controls = true;
    vid.style.cssText = 'max-width:100%;max-height:300px;border-radius:8px;margin-top:8px;border:1px solid var(--border)';
    vid.onerror=function(){this.style.display='none'};
    var vidRow = document.createElement('div');
    vidRow.className = 'editor-row';
    var vidLabel = document.createElement('label');
    vidLabel.className = 'editor-label';
    vidLabel.textContent = 'Video Preview';
    vidRow.appendChild(vidLabel);
    vidRow.appendChild(vid);
    extra.appendChild(vidRow);
  }
}
if (payload.new_text) addField(extra,'new_text','New text',payload.new_text,'textarea');
extra.querySelectorAll('input,textarea').forEach(function(el){el.addEventListener('input',sync)});

function wrap(b,a){var t=document.getElementById('ed-text'),s=t.selectionStart,e=t.selectionEnd,sel=t.value.substring(s,e);t.value=t.value.substring(0,s)+b+(sel||'text')+a+t.value.substring(e);t.focus();t.setSelectionRange(s+b.length,s+b.length+(sel?sel.length:4));sync()}
function ins(txt){var t=document.getElementById('ed-text'),p=t.selectionStart;t.value=t.value.substring(0,p)+txt+t.value.substring(p);t.focus();t.setSelectionRange(p+txt.length,p+txt.length);sync()}
function addField(c,k,l,v,t){var r=document.createElement('div');r.className='editor-row';var lb=document.createElement('label');lb.className='editor-label';lb.textContent=l;r.appendChild(lb);if(t==='textarea'){var ta=document.createElement('textarea');ta.className='editor-textarea';ta.id='ed-'+k;ta.value=v;ta.rows=3;r.appendChild(ta)}else{var i=document.createElement('input');i.className='editor-input';i.id='ed-'+k;i.type=t;i.value=v;r.appendChild(i)}c.appendChild(r);el=function(e){el.addEventListener('input',sync)}}

function sync(){var u=JSON.parse(JSON.stringify(payload));
  // Write recipient back to its canonical field only (never inject helper aliases)
  if(recipientField){
    if(isMultiRecipient){u[recipientField]=document.getElementById('ed-jids').value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}
    else{var rv=document.getElementById('ed-jid').value.trim();if(rv)u[recipientField]=rv}
  }
  var t=document.getElementById('ed-text').value;if('text' in u)u.text=t;else if('caption' in u)u.caption=t;else if('question' in u)u.question=t;else if('name' in u)u.name=t;else if('new_text' in u)u.new_text=t;var o=document.getElementById('ed-options');if(o&&'options'in u)u.options=o.value.split('\n').filter(Boolean);var n=document.getElementById('ed-new_text');if(n)u.new_text=n.value;document.getElementById('payload').value=JSON.stringify(u,null,2)}

async function submit(status){
    sync();
    var raw=document.getElementById('payload').value;
    var p;try{p=JSON.parse(raw)}catch(e){p=raw}
    var c=document.getElementById('comment').value;
    // Only compare fields that existed in ORIGINAL — ignore extra fields like 'to' added by sync
    var edited=Object.keys(ORIGINAL).some(function(k){return JSON.stringify(p[k])!==JSON.stringify(ORIGINAL[k])});
    var r=await fetch('/submit',{method:'POST',body:JSON.stringify({id:'{{REQUEST_ID}}',status:status,comment:c,payload:p,edited:edited})});
    if(r.ok)document.body.innerHTML='<div class="hitl-done"><h2>'+(status==='approved'?'✅ SENT':'❌ REJECTED')+'</h2><p style="opacity:.6">Close this window.</p></div>';
}

document.querySelectorAll('[id^="ed-"]').forEach(function(el){el.addEventListener('input',sync)});
document.getElementById('payload').addEventListener('input',sync);
</script>
</body></html>
