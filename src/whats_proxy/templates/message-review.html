<!DOCTYPE html><html><head><meta charset="utf-8"><title>Whats-Proxy — Message Review</title><link rel="stylesheet" href="/assets/hitl.css"></head><body>
<header class="hitl-header"><div><h1 class="hitl-brand">Whats-Proxy · Message review</h1><p class="hitl-subtitle">Action: {{FUNC_NAME}}</p></div><div class="hitl-actions"><button class="hitl-button hitl-reject" onclick="submit('rejected')">Reject</button><button class="hitl-button hitl-approve" onclick="submit('approved')">Approve & send</button></div></header>
<main class="hitl-container">
<section class="hitl-card"><h2>Message preview</h2><div class="hitl-card-body"><div class="msg-preview" id="msg-preview"></div><div class="msg-meta" id="msg-meta"></div></div></section>
<section class="hitl-card"><h2>Full action JSON</h2><div class="hitl-card-body"><textarea class="hitl-input" id="payload">{{PAYLOAD_JSON}}</textarea></div></section>
</main>
<footer class="hitl-footer"><textarea class="hitl-input" id="comment" placeholder="Comment (optional)"></textarea></footer>
<script>
const ORIGINAL_PAYLOAD_STR = JSON.stringify(JSON.parse('{{PAYLOAD_JSON_SAFE}}'));
const payload = JSON.parse('{{PAYLOAD_JSON_SAFE}}');

// Render message preview from payload
(function() {
    const preview = document.getElementById('msg-preview');
    const meta = document.getElementById('msg-meta');
    const text = payload.text || payload.caption || payload.message || '';
    const jid = payload.jid || payload.to || '';
    const type = payload.type || (payload.text ? 'text' : payload.image ? 'image' : payload.video ? 'video' : 'unknown');
    preview.textContent = text || '[no text content]';
    const parts = [];
    if (jid) parts.push('To: ' + jid);
    if (type) parts.push('Type: ' + type);
    if (payload.file_length) parts.push('Size: ' + payload.file_length + ' bytes');
    meta.textContent = parts.join(' · ');
})();

async function submit(status) {
    let payload;
    const raw = document.getElementById('payload').value;
    try {
        payload = JSON.parse(raw);
    } catch (e) {
        payload = raw;
        const comment = document.getElementById('comment').value;
        const resp = await fetch('/submit', {
            method: 'POST',
            body: JSON.stringify({
                id: '{{REQUEST_ID}}',
                status: status,
                comment: comment,
                payload: payload,
                edited: raw !== ORIGINAL_PAYLOAD_STR
            })
        });
        if (resp.ok) {
            document.body.innerHTML = '<h2>✅ ' + status + '</h2><p>You can close this window.</p>';
        }
        return;
    }
    const comment = document.getElementById('comment').value;
    const edited = (JSON.stringify(payload) !== ORIGINAL_PAYLOAD_STR);
    const resp = await fetch('/submit', {
        method: 'POST',
        body: JSON.stringify({
            id: '{{REQUEST_ID}}',
            status: status,
            comment: comment,
            payload: payload,
            edited: edited
        })
    });
    if (resp.ok) {
        document.body.innerHTML = '<h2>✅ ' + status + '</h2><p>You can close this window.</p>';
    }
}
</script>
</body></html>
