<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whats-Proxy — HITL Review</title>
<link rel="stylesheet" href="/assets/hitl.css">
</head><body>

<header class="hitl-header">
  <div>
    <h1 class="hitl-brand">🟢 Whats-Proxy · Action Review</h1>
    <p class="hitl-subtitle">Action: {{FUNC_NAME}} — review before execution</p>
  </div>
  <div class="hitl-actions">
    <button class="hitl-button hitl-reject" onclick="submit('rejected')">✕ Reject</button>
    <button class="hitl-button hitl-approve" onclick="submit('approved')">✓ Approve &amp; execute</button>
  </div>
</header>

<main class="hitl-container">
  <section class="hitl-card">
    <h2>📋 Action JSON — edit below to modify</h2>
    <div class="hitl-card-body">
      <textarea class="hitl-input" id="payload" rows="16">{{PAYLOAD_JSON}}</textarea>
    </div>
  </section>
</main>

<footer class="hitl-footer">
  <textarea class="hitl-input" id="comment" placeholder="Comment (optional)" rows="2"></textarea>
</footer>

</body></html>
